name: CI

on:
  push:
  pull_request:

# Cancel an older run on the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and downloaded dependencies between runs.
      - uses: gradle/actions/setup-gradle@v6

      # Testcontainers starts PostgreSQL and Kafka with the Docker that is already on the runner.
      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only checks that the Dockerfile builds. The image is not pushed anywhere.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: elev-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
